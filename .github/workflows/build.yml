name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 安装依赖（含 devDependencies 的 electron / electron-builder）
      - name: Install dependencies
        run: npm install

      # 非 tag 推送 / PR：仅构建便携版并上传为 Artifact（无发布）
      - name: Build portable (CI / PR)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: WslDockerManager-Windows
          path: dist/*.exe
          if-no-files-found: warn

      # tag (v*) 推送：构建便携版 + NSIS 安装包，并自动创建 GitHub Release 附上 exe
      - name: Build release artifacts (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win portable nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
